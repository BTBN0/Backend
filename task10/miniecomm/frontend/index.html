<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTBN — Монгол Дэлгүүр</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,600;1,300&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg:      #0a0a0a;
        --bg2:     #111111;
        --surface: #181818;
        --border:  #2a2a2a;
        --text:    #f0ece4;
        --muted:   #666;
        --gold:    #d4a843;
        --gold2:   #f0c060;
        --red:     #c0392b;
        --green:   #27ae60;
      }
      html { font-size: 16px; scroll-behavior: smooth; }
      body {
        font-family: 'Barlow', sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        cursor: crosshair;
      }
      ::-webkit-scrollbar { width: 3px; }
      ::-webkit-scrollbar-track { background: var(--bg); }
      ::-webkit-scrollbar-thumb { background: var(--gold); }
      input, textarea, select, button { font-family: inherit; cursor: auto; }
      a { color: inherit; text-decoration: none; }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes scanline {
        0%   { background-position: 0 0; }
        100% { background-position: 0 4px; }
      }
      .animate { animation: fadeUp 0.5s ease both; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
