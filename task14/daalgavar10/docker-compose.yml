version: '3'

services:
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    command: node app1.js

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    command: node app2.js

  app3:
    build:
      context: .
      dockerfile: Dockerfile
    command: node app3.js

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app1
      - app2
      - app3